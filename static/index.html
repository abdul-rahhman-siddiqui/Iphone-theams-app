<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PhoneCam</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#000;color:#fff;font:16px -apple-system,system-ui,sans-serif;
       height:100dvh;display:flex;flex-direction:column}
  video{flex:1;min-height:0;width:100%;object-fit:contain;background:#111}
  .bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:grid;gap:10px;background:#1c1c1e}
  .row{display:flex;gap:8px}
  select,button{flex:1;font-size:16px;padding:12px;border-radius:10px;border:0;background:#2c2c2e;color:#fff}
  button.primary{background:#0a84ff;font-weight:600}
  button.stop{background:#ff453a}
  #status{font-size:14px;opacity:.8;text-align:center}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="bar">
  <div class="row">
    <select id="res">
      <option value="640x480">480p</option>
      <option value="1280x720" selected>720p</option>
      <option value="1920x1080">1080p</option>
    </select>
    <select id="fps">
      <option>15</option><option selected>24</option><option>30</option>
    </select>
    <select id="q">
      <option value="0.5">Low qual</option>
      <option value="0.7" selected>Med qual</option>
      <option value="0.85">High qual</option>
    </select>
  </div>
  <div class="row">
    <button id="flip">Flip camera</button>
    <button id="go" class="primary">Start</button>
  </div>
  <div id="status">Ready</div>
</div>
<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
let facing = 'environment', stream = null, ws = null, timer = null, wake = null, running = false;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const [w, h] = $('res').value.split('x').map(Number);
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {facingMode: facing, width: {ideal: w}, height: {ideal: h}, frameRate: {ideal: +$('fps').value}}
  });
  $('v').srcObject = stream;
  await $('v').play().catch(() => {});
}

function connect() {
  return new Promise((resolve, reject) => {
    ws = new WebSocket(`wss://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => resolve();
    ws.onerror = () => reject(new Error('Cannot reach PC'));
    ws.onclose = () => { if (running) { setStatus('Disconnected'); stop(); } };
  });
}

function loop() {
  const v = $('v');
  if (!running) return;
  const interval = 1000 / +$('fps').value;
  timer = setTimeout(loop, interval);
  if (!v.videoWidth || !ws || ws.readyState !== 1 || ws.bufferedAmount > 400000) return; // drop if congested
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  ctx.drawImage(v, 0, 0);
  canvas.toBlob(b => { if (b && ws && ws.readyState === 1) ws.send(b); }, 'image/jpeg', +$('q').value);
}

async function start() {
  try {
    if (!navigator.mediaDevices) throw new Error('Camera needs HTTPS - open the https:// link');
    setStatus('Opening camera…');
    await openCamera();
    setStatus('Connecting…');
    await connect();
    running = true;
    $('go').textContent = 'Stop'; $('go').className = 'stop';
    try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
    setStatus('Streaming to PC');
    loop();
  } catch (e) { setStatus('Error: ' + e.message); stop(); }
}

function stop() {
  running = false; clearTimeout(timer);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (wake) { wake.release().catch(() => {}); wake = null; }
  $('go').textContent = 'Start'; $('go').className = 'primary';
}

$('go').onclick = () => running ? (stop(), setStatus('Stopped')) : start();
$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await openCamera(); } catch (e) { setStatus('Error: ' + e.message); }
};
$('res').onchange = $('fps').onchange = () => { if (stream) openCamera().catch(e => setStatus(e.message)); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) {
    try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
  }
});
function setStatus(s) { $('status').textContent = s; }
</script>
</body>
</html>
